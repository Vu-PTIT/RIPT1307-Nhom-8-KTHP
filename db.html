
<style>
#erd { overflow-x: auto; padding: 8px 0; }
#erd svg { min-width: 900px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
</style>
<h2 class="sr-only">Sơ đồ cơ sở dữ liệu hệ thống quản lý thư viện</h2>
<div id="erd"></div>
<script>
window.addEventListener('error', function(e) {
  document.body.innerHTML += `<div style="color: red; padding: 20px; font-family: sans-serif;">
    <h3>Global Error</h3>
    <pre>${e.message} at ${e.filename}:${e.lineno}</pre>
  </div>`;
});
window.addEventListener('unhandledrejection', function(e) {
  document.body.innerHTML += `<div style="color: red; padding: 20px; font-family: sans-serif;">
    <h3>Unhandled Promise Rejection</h3>
    <pre>${e.reason}</pre>
  </div>`;
});
</script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryTextColor: dark ? '#CECBF6' : '#3C3489',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    tertiaryColor: dark ? '#444441' : '#F1EFE8',
  },
});

const diagram = `erDiagram
  roles {
    string id PK
    string name
    string description
  }
  users {
    string id PK
    string role_id FK
    string username
    string email
    string password_hash
    string gender
    date date_of_birth
    string full_name
    string avatar
    string phone
    int max_books_allowed
    int max_days_allowed
    boolean is_active
    timestamp created_at
    timestamp updated_at
  }
  categories {
    string id PK
    string parent_id FK
    string name
    string slug
  }
  documents {
    string id PK
    string category_id FK
    string title
    string author
    string isbn
    string description
    string cover_image
    int total_copies
    int available_copies
    string created_by_id FK
    timestamp created_at
  }
  document_copies {
    string id PK
    string document_id FK
    string copy_code
    string condition
    string status
    timestamp created_at
  }
  wishlists {
    string id PK
    string user_id FK
    string document_id FK
    timestamp added_at
  }
  borrow_cart_items {
    string id PK
    string user_id FK
    string document_id FK
    timestamp added_at
  }
  borrow_records {
    string id PK
    string reader_id FK
    string librarian_id FK
    date borrow_date
    date due_date
    string status
    string notes
    timestamp created_at
  }
  borrow_record_items {
    string id PK
    string borrow_record_id FK
    string document_copy_id FK
    date return_date
    string condition_on_return
    date due_date
  }
  renewal_requests {
    string id PK
    string borrow_record_item_id FK
    string requested_by_id FK
    timestamp request_date
    date new_due_date
    string status
    string reviewed_by_id FK
    timestamp reviewed_at
    string reject_reason
  }
  checkin_logs {
    string id PK
    string user_id FK
    string check_type
    string method
    string handled_by_id FK
    timestamp check_time
    timestamp checkout_time
    timestamp updated_at
  }
  library_settings {
    string id PK
    string setting_key
    string setting_value
    string description
    string updated_by_id FK
    timestamp updated_at
  }
  notifications {
    string id PK
    string user_id FK
    string title
    string message
    string notification_type
    boolean is_read
    timestamp created_at
  }

  roles ||--o{ users : "has"
  users ||--o{ wishlists : "saves"
  users ||--o{ borrow_cart_items : "queues"
  users ||--o{ checkin_logs : "logs"
  users ||--o{ checkin_logs : "handled by"
  users ||--o{ borrow_records : "borrows"
  users ||--o{ borrow_records : "processes"
  users ||--o{ documents : "catalogues"
  users ||--o{ renewal_requests : "requested by"
  users ||--o{ renewal_requests : "reviewed by"
  users ||--o{ library_settings : "updated by"
  users ||--o{ notifications : "receives"
  categories ||--o{ categories : "parent of"
  categories ||--o{ documents : "classifies"
  documents ||--o{ document_copies : "has"
  documents ||--o{ wishlists : "saved in"
  documents ||--o{ borrow_cart_items : "queued in"
  document_copies ||--o{ borrow_record_items : "lent via"
  borrow_records ||--o{ borrow_record_items : "contains"
  borrow_record_items ||--o{ renewal_requests : "requests"
`;

try {
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
} catch (error) {
  document.getElementById('erd').innerHTML = `<div style="color: red; padding: 20px; font-family: sans-serif;">
    <h3>Error rendering Mermaid diagram</h3>
    <pre>${error.message || error}</pre>
  </div>`;
  console.error(error);
}
</script>
